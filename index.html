let CH = {list: [], sub: null, loaded: false, reply: null};
const CHAT_COLS = "id,user_id,nick,avatar_url,steam,body,created_at,is_admin,reply_to,reply_nick,reply_body";
const CT = {
  uz: {reply: "Javob", del: "O'chirish", mute: "Mute", muteAsk: "Necha daqiqaga mute? (masalan 10, 60, 1440; 0 — mute'ni olish)", muted: "Mute berildi", unmuted: "Mute olindi", replyTo: "Javob:", t: "Umumiy chat", l: "CWhub o'yinchilari bilan suhbat. Hurmat bilan yozing — haqorat va reklama uchun ban.", need: "Chatga yozish uchun akkauntga kiring.", ph: "Xabar yozing…", send: "Yuborish", empty: "Hali xabar yo'q — birinchi bo'ling!", live: "jonli"},
  ru: {reply: "Ответить", del: "Удалить", mute: "Мут", muteAsk: "На сколько минут мут? (например 10, 60, 1440; 0 — снять мут)", muted: "Мут выдан", unmuted: "Мут снят", replyTo: "Ответ:", t: "Общий чат", l: "Общение игроков CWhub. Пишите уважительно — за оскорбления и рекламу бан.", need: "Чтобы писать в чат, войдите в аккаунт.", ph: "Напишите сообщение…", send: "Отправить", empty: "Сообщений пока нет — будь первым!", live: "онлайн"}
};
const ct = k => CT[LANG][k];
function chatMsgHTML(m){
  const mine = ME && m.user_id === ME.id, canDel = ME && (mine || ME.admin), canMute = ME?.admin && !mine && !m.is_admin;
  const nm = m.steam ? `<a href="/p/${slug(m.steam)}">${esc(m.nick || "?")}</a>` : esc(m.nick || "?");
  const tm = new Date(m.created_at).toLocaleTimeString(LANG === "ru" ? "ru-RU" : "uz-UZ", {hour: "2-digit", minute: "2-digit"});
  return `<div class="cmsg ${mine ? "mine" : ""}" data-id="${m.id}">${avatar(m.nick || "?", false, m.avatar_url)}
    <div class="cb"><div class="cn">${nm}${m.steam ? `<span class="verified">${I.check}</span>` : ""}${m.is_admin ? `<span class="st answered" style="font-size:9px">🛡 Admin</span>` : ""}<small>${tm}</small></div>${m.reply_to ? `<span class="rq" onclick="chatJump(${m.reply_to})"><b>${esc(m.reply_nick || "?")}</b>${esc(m.reply_body || "")}</span>` : ""}<div class="ct">${esc(m.body)}</div>
      ${ME ? `<div class="cact"><button type="button" onclick="chatReply(${m.id})">↩ ${ct("reply")}</button>${canMute ? `<button type="button" class="warn" onclick="chatMute('${m.user_id}')">🔇 ${ct("mute")}</button>` : ""}${canDel ? `<button type="button" class="warn" onclick="chatDel(${m.id})">✕ ${ct("del")}</button>` : ""}</div>` : ""}</div></div>`;
}
function chatListHTML(){
  if (!CH.list.length) return `<div class="empty">${ct("empty")}</div>`;
  let out = "", day = "";
  CH.list.forEach(m => { const d = new Date(m.created_at).toLocaleDateString(LANG === "ru" ? "ru-RU" : "uz-UZ"); if (d !== day) { day = d; out += `<div class="cday">${d}</div>`; } out += chatMsgHTML(m); });
  return out;
}
function pageChat(){
  const emo = ["🔥", "😂", "👍", "💀", "🎯", "😎", "GG", "EZ", "+", "WP"];
  const input = (sb && ME) ? `<div class="emo">${emo.map(e => `<button type="button" onclick="chatEmo('${e}')">${e}</button>`).join("")}</div>
    <div id="rbar">${replyBarHTML()}</div><form class="chatin" onsubmit="chatPost(event)"><textarea id="gmsg" maxlength="300" placeholder="${ct("ph")}" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea><button class="btn main" type="submit">${ct("send")}</button></form>`
    : `<div class="chatin" style="justify-content:center;align-items:center;gap:12px"><span class="sub">${ct("need")}</span><a class="btn main" href="/login">${t("login")}</a><a class="btn" href="/register">${t("signUp")}</a></div>`;
  return `<h2 class="title" style="text-align:center">💬 ${ct("t")}</h2><p class="lead" style="text-align:center;margin:0 auto 22px">${ct("l")}</p>
    <div class="card gchat"><div class="chathead"><div class="ava">💬</div><div><b>CWhub · ${ct("t")}</b><small>ClanWar 5x5</small></div><span class="live2"><i></i>${ct("live")}</span></div>
      <div class="chatbody" id="gbody">${CH.loaded ? chatListHTML() : `<div class="skel" style="height:60px"></div><div class="skel" style="height:60px;width:70%"></div>`}</div>${input}</div>`;
}
function chatScroll(){ const b = $("#gbody"); if (b) b.scrollTop = b.scrollHeight; }
function chatRedraw(){ const b = $("#gbody"); if (!b) return; const atEnd = b.scrollHeight - b.scrollTop - b.clientHeight < 80; b.innerHTML = chatListHTML(); if (atEnd) chatScroll(); }
async function bindChat(){
  if (!sb) return;
  const r = await sb.from("chat_messages").select(CHAT_COLS).order("id", {ascending: false}).limit(80);
  CH.list = (r.data || []).reverse(); CH.loaded = true;
  const b = $("#gbody"); if (b) { b.innerHTML = chatListHTML(); chatScroll(); }
  if (!CH.sub) CH.sub = sb.channel("cwhub-chat")
    .on("postgres_changes", {event: "INSERT", schema: "public", table: "chat_messages"}, p => { if (!CH.list.some(m => m.id === p.new.id)) { CH.list.push(p.new); CH.list = CH.list.slice(-150); chatRedraw(); } })
    .on("postgres_changes", {event: "DELETE", schema: "public", table: "chat_messages"}, p => { CH.list = CH.list.filter(m => m.id !== p.old.id); chatRedraw(); })
    .subscribe();
}
async function chatPost(ev){
  ev.preventDefault();
  const body = ($("#gmsg").value || "").trim(); if (!body) return;
  $("#gmsg").value = "";
  const row = {body}; if (CH.reply) row.reply_to = CH.reply.id;
  const r = await sb.from("chat_messages").insert(row).select(CHAT_COLS).single();
  if (r.error) { toast(r.error.message); $("#gmsg").value = body; return; }
  CH.reply = null; const rb = $("#rbar"); if (rb) rb.innerHTML = "";
  if (!CH.list.some(m => m.id === r.data.id)) { CH.list.push(r.data); chatRedraw(); }
  chatScroll(); $("#gmsg").focus();
}
function replyBarHTML(){
  const q = CH.reply; if (!q) return "";
  return `<div class="replybar"><span>↩ ${ct("replyTo")}</span><span class="q"><b>${esc(q.nick || "?")}</b> ${esc(q.body)}</span><button type="button" onclick="chatReply(null)">✕</button></div>`;
}
function chatReply(id){
  const m = id == null ? null : CH.list.find(x => x.id === id);
  CH.reply = m ? {id: m.id, nick: m.nick, body: m.body} : null;
  const rb = $("#rbar"); if (rb) rb.innerHTML = replyBarHTML();
  const i = $("#gmsg"); if (i && m) i.focus();
}
function chatJump(id){
  const el = document.querySelector(`.cmsg[data-id="${id}"]`); if (!el) return;
  el.scrollIntoView({behavior: "smooth", block: "center"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400);
}
async function chatMute(uid){
  const v = prompt(ct("muteAsk"), "60"); if (v === null) return;
  const mins = parseInt(v, 10); if (isNaN(mins) || mins < 0) return;
  const r = await sb.rpc("chat_mute", {p_user: uid, p_minutes: mins});
  if (r.error || !r.data?.ok) return toast(r.error?.message || "✕");
  toast(mins > 0 ? `🔇 ${ct("muted")} — ${mins} min` : ct("unmuted"));
}
function chatEmo(e){ const i = $("#gmsg"); if (!i) return; i.value = (i.value ? i.value + " " : "") + e; i.focus(); }
async function chatDel(id){ const r = await sb.from("chat_messages").delete().eq("id", id); if (r.error) return toast(r.error.message); CH.list = CH.list.filter(m => m.id !== id); chatRedraw(); }
/* ===================================================================== router */
const ROUTES = ["#/", "#/top", "#/matches", "#/ranks", "#/rules", "#/bans", "#/premium"];
function renderNav(){
  const h = curRoute() || "#/";
  const isOn = i => h === ROUTES[i] || (i === 1 && /^#\/(p|vs)\//.test(h)) || (i === 2 && h.startsWith("#/m/"));
  // asosiylari ko'rinib turadi, qolgani — "Ko'proq" menyusida (sarlavha bir qatorga sig'sin)
  const link = (href, label, on) => `<a href="${href}" class="${on ? "on" : ""}">${label}</a>`;
  const extra = [link("/rules", t("nav")[4], isOn(4)), link("/bans", t("nav")[5], isOn(5)),
    link("/support", LANG === "ru" ? "Поддержка" : "Yordam", h === "#/support")]
    .concat(ME?.admin ? [link("/admin", "🛡 Admin", h === "#/admin")] : []);
  const extraOn = isOn(4) || isOn(5) || h === "#/support" || h === "#/admin";
  $("#nav").innerHTML = [0, 1, 2, 3].map(i => link(ROUTES[i].slice(1), t("nav")[i], isOn(i))).join("")
    + link("/chat", "💬 Chat", h === "#/chat")
    + `<div class="more"><button type="button" class="${extraOn ? "on" : ""}" onclick="this.parentNode.classList.toggle('open')">${LANG === "ru" ? "Ещё" : "Ko'proq"}<i>▾</i></button><div class="menu">${extra.join("")}</div></div>`
    + `<a href="/premium" class="prem ${h === "#/premium" ? "on" : ""}">👑 ${pt("nav")}</a>`;
  const crown = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 7 4.5 4L12 4l4.5 7L21 7l-2 12H5Z"/></svg>';
  const bi = [I.home, I.list, I.sword, crown, I.user], br = ["#/", "#/top", "#/matches", "#/premium", "#/me"];
  const bl = [t("nav")[0], t("nav")[1], t("nav")[2], pt("nav"), ME ? t("myProfile").split(" ")[0] : t("login")];
  if (!ME) br[4] = "#/login";
  $("#bnav").innerHTML = br.map((r, i) => `<a href="${r.slice(1)}" class="${i === 3 ? "prem " : ""}${(i < 3 && isOn(i)) || h === r && i >= 3 ? "on" : ""}">${bi[i]}<span>${bl[i]}</span></a>`).join("");
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  document.documentElement.lang = LANG;
  $("#fabout").textContent = t("about"); $("#f1").textContent = t("f1"); $("#f2").textContent = t("f2");
  $("#fl1").innerHTML = [0, 1, 2, 3].map(i => `<a href="${ROUTES[i].slice(1)}">${t("nav")[i]}</a>`).join("");
  $("#fl2").innerHTML = `<a href="${ROUTES[4].slice(1)}">${t("nav")[4]}</a><a href="${ROUTES[5].slice(1)}">${t("nav")[5]}</a><a href="/premium">👑 ${pt("nav")}</a><a href="/support">${x("supT")}</a><a href="/register">${t("authT")}</a>`;
  const shopBot = SHOP().bot || SHOP_DEFAULT.bot; $("#fshop").textContent = "@" + shopBot; $("#fshop").href = "https://t.me/" + shopBot;
  $("#fbot").textContent = "@" + botName(); $("#fbot").href = "https://t.me/" + botName();
}
function render(scroll = true){
  if (!IDX) return;
  const h = curRoute() || "#/";
  renderNav(); renderAcct();
  let html;
  if (h.startsWith("#/p/")) html = pageProfile(decodeURIComponent(h.slice(4)));
  else if (h.startsWith("#/m/")) html = pageMatch(h.slice(4));
  else if (h.startsWith("#/vs/")) { const [a, b] = h.slice(5).split("/").map(decodeURIComponent); html = pageVs(a, b); }
  else html = ({"#/top": pageTop, "#/matches": pageMatches, "#/ranks": pageRanks, "#/bans": pageBans, "#/rules": pageRules, "#/me": pageMe, "#/login": () => { authTab = 0; return ME ? pageMe() : authPage(); }, "#/register": () => { authTab = 1; return ME ? pageMe() : authPage(); }, "#/premium": pagePremium, "#/support": pageSupport, "#/admin": pageAdmin, "#/chat": pageChat}[h] || pageHome)();
  const app = $("#app");
  app.innerHTML = html;
  if (scroll) { app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); }
  fxBind(app, !scroll);
  if (h === "#/top") bindTop();
  if (h === "#/premium") bindPremium();
  if (h === "#/support" && scroll) bindSupport();
  if (h === "#/chat" && scroll) bindChat();
  if ((h === "#/me" || h.startsWith("#/p/")) && scroll && sb && ME) loadFriends().then(() => { const hh = curRoute(); if (hh === h) render(false); });
  if (h === "#/admin" && scroll) bindAdmin();
  renderBanners(); tickCountdown();
  onScroll();
  $("#upd").textContent = D?.updated ? `${t("updated")}: ${ago(D.updated)}` : "";
  if (scroll) window.scrollTo(0, 0);
}
// Server (cw_web.amxx) botsiz yozadigan jadval: o'yinchilar, matchlar, PTS tarixi, jonli holat, banlar
function feedServer(row){
  const s = Object.assign({}, row);
  if (Date.now() / 1000 - (row.updated || 0) > 150) { s.online = false; s.players = []; s.count = 0; }
  return s;
}
async function loadFeed(){
  const q = (kind, n) => sb.from("cw_feed").select("row,t").eq("kind", kind).order("t", {ascending: false}).limit(n);
  const [pl, hi, ms, rs, sv] = await Promise.all([q("player", 2000), q("hist", 2000), q("mstat", 2000), q("result", 30), sb.from("cw_feed").select("kind,row,t").in("kind", ["server", "bans"])]);
  if (pl.error) return;
  const rows = r => (r.data || []).map(x => x.row);
  if (pl.data?.length) D.players = rows(pl);
  if (hi.data?.length) D.history = rows(hi).reverse();
  if (ms.data?.length) D.mstats = rows(ms).reverse();
  if (rs.data?.length) D.results = rows(rs).reverse();
  (sv.data || []).forEach(x => {
    if (x.kind === "bans") D.bans = x.row.list || [];
    if (x.kind === "server") D.server = feedServer(x.row);
  });
  D.updated = Math.max(D.updated || 0, ...(sv.data || []).map(x => x.t || 0));
}
async function refreshLive(){
  if (!sb || !IDX || (curRoute() || "#/") !== "#/") return;
  try { const r = await sb.from("cw_feed").select("row").eq("kind", "server").maybeSingle();
    if (r.data?.row) { D.server = feedServer(r.data.row); const el = $("#livebox"); if (el) el.innerHTML = livePanel(); } } catch (e) {}
}
setInterval(refreshLive, 20000);
// Supabase javob bermasa ham sayt qotib qolmasin
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
async function load(refresh){
  for (const u of DATA_URLS){
    try { const r = await fetch(u + "?t=" + Math.floor(Date.now() / 60000), {cache: "no-store"}); if (r.ok){ D = await r.json(); break; } } catch (e) {}
  }
  D = D || {players: [], results: []};
  if (sb) {   // bot har daqiqada yozadigan jonli ma'lumot (GitHub'dagidan yangi bo'lsa — shuni olamiz)
    try { const r = await withTimeout(sb.from("site_data").select("value").eq("key", "data").maybeSingle(), 5000);
      if (r?.data?.value && (r.data.value.updated || 0) >= (D.updated || 0)) D = r.data.value; } catch (e) {}
    D = Object.assign({}, D);
    try { await withTimeout(loadFeed(), 6000); } catch (e) {}
    await withTimeout(loadProfiles(), 5000);
  }
  buildIndex();
  const h = curRoute() || "#/";
  // avval ma'lumot bilan chizamiz, akkaunt va sozlamalar — keyin
  if (!refresh) { render(true); setTimeout(() => $("#pre").classList.add("done"), 250); }
  else if (h === "#/" || h === "#/me") render(false);
  else $("#upd").textContent = D.updated ? `${t("updated")}: ${ago(D.updated)}` : "";
  if (!refresh || h === "#/me") await withTimeout(refreshMe(), 8000);
  await withTimeout(loadSettings(), 8000);
  renderAcct(); renderNav(); renderBanners();
  if (!refresh && /^#\/(me|login|register|support|admin|premium)$/.test(curRoute() || "")) { render(false); if (curRoute() === "#/support") bindSupport(); if (curRoute() === "#/admin") bindAdmin(); }
}
// Diqqat: bu callback ichida Supabase'ni kutish (await) deadlock beradi — shuning uchun setTimeout
if (sb) sb.auth.onAuthStateChange((ev) => {
  if (ev !== "SIGNED_IN" && ev !== "SIGNED_OUT" && ev !== "PASSWORD_RECOVERY") return;
  setTimeout(async () => { await refreshMe(); renderAcct(); renderNav(); renderBanners(); const hh = curRoute() || "#/"; if (hh === "#/me" || hh === "#/login" || hh === "#/register") render(false); }, 0);
});
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { LANG = b.dataset.l; store.set("lang", LANG); render(false); });
// toza manzillar (/top, /me): ichki yo'nalish "#/..." ko'rinishida qoladi, URL'da esa "#" yo'q
window.addEventListener("popstate", () => render());
document.addEventListener("click", e => {
  const a2 = e.target.closest && e.target.closest('a[href^="/"]:not([href^="//"])');
  if (!a2 || e.ctrlKey || e.metaKey || e.shiftKey || a2.target === "_blank" || /\.(html|jpg|png|sql|json)$/.test(a2.getAttribute("href"))) return;
  e.preventDefault(); go(a2.getAttribute("href"));
});
load(false);
setTimeout(() => $("#pre").classList.add("done"), 1500);   // ma'lumot sekin kelsa ham kutib qolmaydi
setInterval(() => load(true), 120000);
// kod sahifasi ochiq va hali ulanmagan bo'lsa — har 10 soniyada tekshiramiz
setInterval(async () => {
  if ((curRoute() || "#/") !== "#/me" || !ME || ME.acc?.steam) return;
  await refreshMe();
  if (ME?.acc?.steam) { renderAcct(); render(false); toast("✓"); }
}, 10000);
</script>
