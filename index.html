<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CwhubUZ ClanWar</title>
<meta name="description" content="CwhubUZ — CS 1.6 ClanWar 5x5 server (Toshkent): onlayn holat, PTS reyting, ranklar, match statistikasi, o'yinchi profillari.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d11; --panel:#13161e; --panel2:#1a1e29; --panel3:#222736; --line:#252a37;
  --text:#eceef3; --muted:#8a91a4; --accent:#f5a623; --accent-ink:#1d1405;
  --win:#43c27a; --loss:#e5534b; --draw:#c9a227;
  --tL:#7ccf7c; --tM:#57a6ff; --tH:#c27bff; --tP:#ffc428;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Rajdhani,sans-serif;margin:0;letter-spacing:.3px;line-height:1.1}
h2{font-size:28px;margin-bottom:14px}
h3{font-size:20px;margin-bottom:10px}

/* header */
header{border-bottom:1px solid var(--line);background:rgba(11,13,17,.9);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.bar{display:flex;align-items:center;gap:14px;height:60px}
.logo{font:700 23px Rajdhani,sans-serif;letter-spacing:.5px;text-decoration:none;white-space:nowrap}
.logo b{color:var(--accent)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav a{text-decoration:none;color:var(--muted);padding:7px 11px;border-radius:8px;font-weight:500;white-space:nowrap;font-size:14px}
nav a.on,nav a:hover{color:var(--text);background:var(--panel2)}
.lang{display:flex;background:var(--panel2);border-radius:8px;padding:3px}
.lang button{border:0;background:none;padding:4px 9px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
main{padding:26px 0 70px}

/* cards & basics */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.mt{margin-top:16px}
.sub{color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin-top:12px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font-weight:600;font-size:15px;padding:11px 17px;border-radius:10px;background:var(--panel3);color:var(--text)}
.btn:hover{filter:brightness(1.18)}
.btn.main{background:var(--accent);color:var(--accent-ink);font-size:16px;padding:13px 22px}
.btn.sm{padding:7px 12px;font-size:13px}
.mono{font-family:ui-monospace,Consolas,monospace;background:var(--panel2);padding:2px 7px;border-radius:6px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.live{color:var(--text)} .pill.live .dot{background:var(--win);box-shadow:0 0 0 4px rgba(67,194,122,.18)}
.empty{color:var(--muted);padding:22px 0;text-align:center}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:#10131a;padding:30px;display:grid;grid-template-columns:1.35fr 1fr;gap:26px}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding:22px}}
.hero .bgmap{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;filter:saturate(.6);mask-image:linear-gradient(90deg,transparent 0%,#000 60%)}
.hero>*{position:relative}
.season{font:700 13px Rajdhani,sans-serif;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.hero h1{font-size:50px;margin:8px 0 6px}
@media(max-width:560px){.hero h1{font-size:38px}}
.kv{display:flex;flex-wrap:wrap;gap:24px;margin:18px 0 20px}
.kv span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.kv b{font:700 24px Rajdhani,sans-serif}
.kv b.addr{font:600 15px ui-monospace,Consolas,monospace;display:inline-block;margin-top:5px;word-break:break-all}
.live-list{background:rgba(19,22,30,.85);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media(max-width:700px){.statstrip{grid-template-columns:repeat(2,1fr)}}
.ss{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ss b{display:block;font:700 28px Rajdhani,sans-serif}
.ss span{color:var(--muted);font-size:13px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{background:var(--panel2);border-radius:12px;padding:14px}
.step i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-bottom:8px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:36px;height:24px;padding:0 6px;border-radius:7px;font:700 14px Rajdhani,sans-serif;border:2px solid currentColor}
.badge.cal{opacity:.45;border-style:dashed}
.tL{color:var(--tL)}.tM{color:var(--tM)}.tH{color:var(--tH)}.tP{color:var(--tP)}
.W{color:var(--win)}.L{color:var(--loss)}.D{color:var(--draw)}
.form{display:inline-flex;gap:3px}
.form i{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--panel3)}
.form i.W{background:var(--win)}.form i.L{background:var(--loss)}.form i.D{background:var(--draw)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:15px Inter,sans-serif;margin-bottom:12px}
select.search{margin:0}

/* podium */
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.pod{min-width:0}
.pod{background:var(--panel2);border-radius:14px;padding:16px;text-align:center;cursor:pointer;border:1px solid var(--line)}
.pod:hover{border-color:var(--accent)}
.pod .place{font:700 13px Rajdhani,sans-serif;letter-spacing:1.5px;color:var(--muted)}
.pod .nm{font:700 22px Rajdhani,sans-serif;margin:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.p1{border-color:rgba(255,196,40,.5)}

/* matches */
.mcard{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:12px;background:var(--panel2);text-decoration:none;margin-bottom:8px;border:1px solid transparent}
.mcard:hover{border-color:var(--line);filter:brightness(1.08)}
.mthumb{height:64px;border-radius:8px;background:#0f1218 center/cover;display:grid;place-items:end start;padding:6px;font:700 13px Rajdhani,sans-serif}
.mscore{font:700 26px Rajdhani,sans-serif;font-variant-numeric:tabular-nums}
@media(max-width:560px){.mcard{grid-template-columns:72px 1fr}.mcard .mscore{grid-column:2}}
.mhead{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);padding:24px;background:#10131a;text-align:center}
.mhead .bgmap{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.2}
.mhead>*{position:relative}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-top:10px}
.vs .tn{font:700 26px Rajdhani,sans-serif}
.vs .sc{font:700 56px Rajdhani,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:560px){.vs{gap:8px}.vs .sc{font-size:38px}.vs .tn{font-size:19px}}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.aw{background:var(--panel2);border-radius:12px;padding:14px}
.aw span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.aw b{display:block;font:700 20px Rajdhani,sans-serif;margin-top:4px}
tr.left td{opacity:.55}

/* profile */
.prof{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
@media(max-width:760px){.prof{grid-template-columns:1fr}}
.bigbadge{width:128px;height:128px;border-radius:26px;border:5px solid currentColor;display:grid;place-items:center;font:700 56px Rajdhani,sans-serif;background:var(--panel2)}
.bigbadge.cal{border-style:dashed;font-size:20px;text-align:center;line-height:1.1}
.prog{height:12px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:currentColor}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.tile{background:var(--panel2);border-radius:12px;padding:13px;text-align:center}
.tile b{display:block;font:700 25px Rajdhani,sans-serif}
.tile span{color:var(--muted);font-size:12px}
.chart{width:100%;height:170px;display:block}
.people{display:grid;gap:8px}
.person{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);text-decoration:none}
.person:hover{filter:brightness(1.15)}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.a{background:var(--panel2);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center}
.a .ic{font-size:22px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel3)}
.a.off{opacity:.38;filter:grayscale(1)}
.a b{display:block;font-size:13px}
.a span{font-size:12px;color:var(--muted)}

/* ranks */
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rk{background:var(--panel2);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
.rk small{display:block;color:var(--muted)}
.rk .cnt{margin-left:auto;color:var(--muted);font-size:13px}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:22px 0}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
ol.rules{margin:0;padding-left:22px} ol.rules li{padding:5px 0}
</style>
</head>

function mRating(s){ const r = Math.max(s.r, 1); return ((s.k / r) / 0.679 + 0.7 * ((r - s.d) / r) / 0.317) / 1.7; }

function buildIndex(){
  const players = D?.players || [], ms = D?.mstats || [], hist = D?.history || [];
  const byId = {}; players.forEach(p => byId[p.id] = Object.assign({}, p, {ms: [], hist: []}));
  // matchlar: tugash vaqti (t) bo'yicha guruhlash
  const matches = {};
  ms.forEach(s => {
    const m = matches[s.t] || (matches[s.t] = {t: s.t, map: s.map, sa: s.sa, sb: s.sb, na: s.na, nb: s.nb, rows: []});
    s.rating = mRating(s);
    m.rows.push(s);
    if (byId[s.id]) byId[s.id].ms.push(s);
  });
  hist.forEach(h => { if (byId[h.id]) byId[h.id].hist.push(h); });
  // har bir match qatoriga PTS o'zgarishini qo'shish (history bilan vaqt bo'yicha)
  Object.values(matches).forEach(m => {
    m.rows.forEach(s => {
      const h = byId[s.id]?.hist.find(x => Math.abs(x.t - m.t) < 900);
      s.delta = h ? h.delta : null;
    });
    const real = m.rows.filter(r => !r.left);
    m.mvp = real.slice().sort((a, b) => b.rating - a.rating)[0];
    m.winner = m.sa > m.sb ? "A" : m.sb > m.sa ? "B" : "D";
  });
  // o'yinchi bo'yicha qo'shimcha ko'rsatkichlar
  Object.values(byId).forEach(p => {
    p.ms.sort((a, b) => a.t - b.t); p.hist.sort((a, b) => a.t - b.t);
    const games = p.hist.length ? p.hist : p.ms;
    p.form = games.slice(-5).map(g => g.res);
    let cur = 0, best = 0; games.forEach(g => { cur = g.res === "W" ? cur + 1 : 0; best = Math.max(best, cur); }); p.streak = best;
    const k = p.ms.reduce((a, s) => a + s.k, 0), hs = p.ms.reduce((a, s) => a + s.hs, 0);
    const dmg = p.ms.reduce((a, s) => a + s.dmg, 0), rr = p.ms.reduce((a, s) => a + s.r, 0);
    p.hsp = k ? Math.round(100 * hs / k) : 0;
    p.adr = rr ? Math.round(dmg / rr) : 0;
    p.mvps = Object.values(matches).filter(m => m.mvp && m.mvp.id === p.id).length;
    p.maxKills = Math.max(0, ...p.ms.map(s => s.k));
    p.lastT = Math.max(0, ...games.map(g => g.t));
  });
  const sorted = Object.values(byId).sort((a, b) => b.pts - a.pts || b.matches - a.matches);
  sorted.forEach((p, i) => p.place = i + 1);
  IDX = {byId, sorted, matches: Object.values(matches).sort((a, b) => b.t - a.t)};
}

function chart(hist){
  if (hist.length < 2) return "";
  const W = 600, H = 170, P = 22, v = hist.map(h => h.pts), mn = Math.min(...v) - 10, mx = Math.max(...v) + 10;
  const x = i => P + i * (W - 2 * P) / (v.length - 1), y = p => H - P - (p - mn) * (H - 2 * P) / Math.max(mx - mn, 1);
  const pts = v.map((p, i) => `${x(i).toFixed(1)},${y(p).toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    ${v.map((p, i) => `<circle cx="${x(i)}" cy="${y(p)}" r="3.5" fill="${hist[i].res === "W" ? "var(--win)" : hist[i].res === "L" ? "var(--loss)" : "var(--draw)"}"><title>${p} PTS</title></circle>`).join("")}
    <text x="${P}" y="14" fill="var(--muted)" font-size="12">${Math.max(...v)}</text><text x="${P}" y="${H - 4}" fill="var(--muted)" font-size="12">${Math.min(...v)}</text></svg>`;
}
function people(p){
  const mates = {}, riv = {};
  p.ms.forEach(s => {
    const m = IDX.matches.find(x => x.t === s.t); if (!m) return;
    m.rows.forEach(o => {
      if (o.id === p.id || o.team === "X" || s.team === "X") return;
      const bag = o.team === s.team ? mates : riv;
      const e = bag[o.id] || (bag[o.id] = {id: o.id, name: o.name, n: 0, w: 0});
      e.n++; if (s.res === "W") e.w++;
    });
  });
  const list = (bag, f) => { const a = Object.values(bag).sort((x, y) => y.n - x.n).slice(0, 5);
    return a.length ? `<div class="people">${a.map(e => `<a class="person" href="#/p/${slug(e.id)}"><b>${esc(e.name)}</b><span class="sub">${f(e.n, pct(e.w, e.n))}</span></a>`).join("")}</div>` : `<div class="empty">—</div>`; };
  return {mates: list(mates, t("together")), rivals: list(riv, t("against"))};
}

  </div>
  <div class="card mt"><h3>${t("recent")}</h3>
    ${games.length ? `<div class="tw"><table><tr><th>${t("map")}</th><th></th><th class="num">K–D</th><th class="num">PTS</th><th></th></tr>
      ${games.map(g => { const m = IDX.matches.find(x => Math.abs(x.t - g.t) < 900);
        return `<tr${m ? ` class="click" onclick="location.hash='#/m/${m.t}'"` : ""}><td>${esc(g.map)} <span class="sub">· ${fmtDate(g.t)}</span></td>
        <td class="${g.res}">${{W: t("win"), L: t("loss"), D: t("draw")}[g.res]}${m ? ` <span class="sub">${m.sa}:${m.sb}</span>` : ""}</td>
        <td class="num">${g.k}–${g.d}</td><td class="num ${g.delta >= 0 ? "W" : "L"}">${g.delta == null ? "—" : (g.delta >= 0 ? "+" : "") + g.delta}</td>
        <td class="num sub">${g.pts ?? ""}</td></tr>`; }).join("")}</table></div>` : `<div class="empty">${t("noMatches")}</div>`}
  </div>
  <div class="grid2 mt"><div class="card"><h3>${t("mates")}</h3>${pp.mates}</div><div class="card"><h3>${t("rivals")}</h3>${pp.rivals}</div></div>
  <div class="note">${t("linkNote")}</div>`;
}

function pageVs(a, b){
  const A = IDX.byId[a], B = IDX.byId[b];
  const opts = sel => `<select class="search" onchange="location.hash='#/vs/${slug(a)}/'+encodeURIComponent(this.value)"><option value="">${t("choose")}</option>
    ${IDX.sorted.filter(p => p.id !== a).map(p => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""}>${esc(p.name)} (${p.pts})</option>`).join("")}</select>`;
  if (!A) return `<div class="card empty">${t("notFound")}</div>`;
  const row = (label, f, better) => { const x = f(A), y = B ? f(B) : null; const bx = B && better(x, y), by = B && better(y, x);
    return `<tr><td class="num ${bx ? "W" : ""}"><b>${x}</b></td><td style="text-align:center" class="sub">${label}</td><td class="${by ? "W" : ""}"><b>${B ? y : "—"}</b></td></tr>`; };
  const gt = (x, y) => parseFloat(x) > parseFloat(y);
  return `<a class="btn sm" href="#/p/${slug(a)}">${t("back")}</a><h2 class="mt">${t("compare")}</h2>
  <div class="card">${opts(b)}<div class="tw mt"><table>
    <tr><th class="num">${esc(A.name)}</th><th></th><th>${B ? esc(B.name) : ""}</th></tr>
    ${row("PTS", p => p.pts, gt)}${row(t("rank"), p => rankName(p.pts), (x, y) => RANKS.findIndex(r => r[1] === x) > RANKS.findIndex(r => r[1] === y))}
    ${row(t("matches"), p => p.matches, gt)}${row(t("wins") + " %", p => pct(p.wins, p.matches), gt)}
    ${row("K/D", p => kd(p.kills, p.deaths), gt)}${row("HS%", p => p.hsp, gt)}${row("ADR", p => p.adr, gt)}
    ${row("MVP", p => p.mvps, gt)}${row(t("streak"), p => p.streak, gt)}</table></div></div>`;
}

function pageRanks(){
  const cnt = i => IDX.sorted.filter(p => rankIdx(p.pts) === i).length;
  return `<h2>${t("ranksT")}</h2><div class="card">
    <div class="ladder">${RANKS.map((r, i) => `<div class="rk"><span class="badge ${"t" + r[1][0]}">${r[1]}</span>
      <div><b>${r[0]}${RANKS[i + 1] ? "–" + (RANKS[i + 1][0] - 1) : "+"}</b><small>PTS</small></div><span class="cnt">${cnt(i)} 👤</span></div>`).join("")}</div>
    <p class="sub" style="line-height:1.7;margin:16px 0 0">${t("ranksNote")}</p></div>`;
}
function pageBans(){
  const b = D?.bans || [];
  return `<h2>${t("bansT")}</h2><div class="card">
    ${b.length ? `<div class="tw"><table><tr><th>${t("player")}</th><th>${t("reason")}</th><th>${t("since")}</th><th>${t("remain")}</th><th>${t("admin")}</th></tr>
      ${b.map(x => `<tr><td class="name">${esc(x.name)}</td><td>${esc(x.reason)}</td><td>${esc(x.since)}</td><td>${esc(x.left)}</td><td>${esc(x.admin)}</td></tr>`).join("")}</table></div>`
      : `<div class="empty">${t("noBans")}</div>`}
    <div class="btns mt"><a class="btn" href="https://t.me/CwhubUZ" target="_blank" rel="noopener">✈ ${t("appeal")}</a></div>
    <div class="note">${t("appealNote")}</div></div>`;
}
function pageRules(){
  const uz = LANG === "uz";
  const L = uz ? [["Chit (WH, aim, skript)","1 hafta"],["Ota-onani haqorat qilish","1 hafta"],["Reklama","1 hafta"],["Nomaqbul nick","1 soat"],["So'kinish (mat)","30 daqiqa"],["Spam / flood","30 daqiqa"],["Noadekvat xatti-harakat","5 daqiqa"],["To'la 5x5 jamoaga 6-o'yinchi","5 daqiqa"]]
    : [["Читы (WH, aim, скрипты)","1 неделя"],["Оскорбление родных","1 неделя"],["Реклама","1 неделя"],["Недопустимый ник","1 час"],["Мат","30 минут"],["Спам / флуд","30 минут"],["Неадекват","5 минут"],["6-й игрок в полной команде 5x5","5 минут"]];
  return `<h2>${t("rulesT")}</h2><div class="card"><ol class="rules">
    ${L.map(r => `<li>${r[0]} — <b>${r[1]}</b> ban</li>`).join("")}
    <li>${uz ? "Majburiy" : "Обязательно"}: <span class="mono">gl_monolights 0</span> <span class="mono">net_graph 0</span> <span class="mono">developer 0</span></li>
    <li>${uz ? "Serverda hamma teng — admin o'yinda ustunlik olmaydi. Adminlar va raqiblarni hurmat qiling." : "На сервере все равны — админка не даёт преимущества в игре. Уважайте админов и соперников."}</li></ol>
    <div class="note">${uz ? "Demo avtomatik yoziladi." : "Демо записывается автоматически."} /score /pts /top /rules /tg</div></div>`;
}

/* ===================================================================== router */
function renderNav(){
  const routes = ["#/", "#/top", "#/matches", "#/ranks", "#/bans", "#/rules"], h = location.hash || "#/";
  $("#nav").innerHTML = t("nav").map((n, i) => {
    const on = h === routes[i] || (i === 1 && /^#\/(p|vs)\//.test(h)) || (i === 2 && h.startsWith("#/m/"));
    return `<a href="${routes[i]}" class="${on ? "on" : ""}">${n}</a>`;
  }).join("");
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  document.documentElement.lang = LANG;
}
function render(scroll = true){
  if (!IDX) return;
  const h = location.hash || "#/";
  renderNav();
  let html;
  if (h.startsWith("#/p/")) html = pageProfile(decodeURIComponent(h.slice(4)));
  else if (h.startsWith("#/m/")) html = pageMatch(h.slice(4));
  else if (h.startsWith("#/vs/")) { const [a, b] = h.slice(5).split("/").map(decodeURIComponent); html = pageVs(a, b); }
  else html = ({"#/top": pageTop, "#/matches": pageMatches, "#/ranks": pageRanks, "#/bans": pageBans, "#/rules": pageRules}[h] || pageHome)();
  $("#app").innerHTML = html;
  if (h === "#/top") bindTop();
  $("#upd").textContent = D?.updated ? `${t("updated")}: ${ago(D.updated)}` : "";
  if (scroll) window.scrollTo(0, 0);
}
async function load(refresh){
  for (const u of DATA_URLS){
    try { const r = await fetch(u + "?t=" + Math.floor(Date.now() / 60000), {cache: "no-store"}); if (r.ok){ D = await r.json(); break; } } catch (e) {}
  }
  D = D || {players: [], results: []};
  buildIndex();
  const h = location.hash || "#/";
  if (!refresh || h === "#/") render(!refresh);
  else $("#upd").textContent = D.updated ? `${t("updated")}: ${ago(D.updated)}` : "";
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { LANG = b.dataset.l; try { localStorage.setItem("lang", LANG); } catch (e) {} render(false); });
window.addEventListener("hashchange", () => render());
load(false);
setInterval(() => load(true), 120000);
</script>
</body>
</html>
